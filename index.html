<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Library</title>
    </head>
    <body>
        <header id="title">
            <h1>Game Library</h1>
        </header>
        <div id="addGameSection">
            <form id="gameForm">
                <div>
                    <label for="gameName">Game name:</label>
                    <input type="text" id="gameName" required>
                </div>
                <div>
                    <label for="gameGenre">Genre:</label>
                    <select id="gameGenre" required>
                        <option value="">Select genre</option>
                        <option value="action">Action</option>
                        <option value="adventure">Adventure</option>
                        <option value="rpg">RPG</option>
                        <option value="strategy">Strategy</option>
                        <option value="puzzle">Puzzle</option>
                        <option value="sport">Sport</option>
                        <option value="racing">Racing</option>
                        <option value="simulation">Simulation</option>
                        <option value="horror">Horror</option>
                        <option value="casual">Casual</option>
                        <option value="metroidvania">Metroidvania</option>
                        <option value="fps">FPS</option>
                        <option value="moba">MOBA</option>
                        <option value="rts">RTS</option>
                        <option value="platformer">Platformer</option>
                        <option value="fighting">Fighting</option>
                        <option value="indie">Indie</option>
                        <option value="survival">Survival</option>
                        <option value="sandbox">Sandbox</option>
                    </select>
                </div>
                <div>
                    <label for="gameStatus">Status:</label>
                    <select id="gameStatus" required>
                        <option value="">Select status</option>
                        <option value="backlog">Backlog</option>
                        <option value="playing">Playing</option>
                        <option value="completed">Completed</option>
                        <option value="dropped">Dropped</option>
                    </select>
                </div>
                <div>
                    <label for="gameRating">Rating:</label>
                    <input type="number" id="gameRating" value="0" min="1" max="10" required>
                </div>
                <button type="button" id="addGameButton" onclick="addGame()">Add game</button>
            </form>
        </div>
        <div id="gameList">
            <div id="gameCards"></div>
            <button id="addGameSectionButton" onclick="loadScene(addGameSection)">Add game</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
